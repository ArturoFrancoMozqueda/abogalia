name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: python -m unittest discover -s scripts/tests
      - run: python scripts/install_gitleaks.py --destination "$RUNNER_TEMP/abogalia-scanner"
      - run: python scripts/check_secrets.py --binary "$RUNNER_TEMP/abogalia-scanner/gitleaks" --self-test
      - run: python scripts/check_secrets.py --binary "$RUNNER_TEMP/abogalia-scanner/gitleaks" --history

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: python scripts/install_gitleaks.py --destination "$RUNNER_TEMP/abogalia-scanner"
      - run: python scripts/check_secrets.py --binary "$RUNNER_TEMP/abogalia-scanner/gitleaks" --artifact apps/web/build/client

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: make api-install
      - run: make check-api
      - run: make test-api
