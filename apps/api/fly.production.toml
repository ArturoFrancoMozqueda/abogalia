# Legalia only. Use an existing reviewed image and --ha=false; no remote builder.
app = "legalia-api"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "15s"

[env]
  ABOGALIA_ENVIRONMENT = "production"
  ABOGALIA_IDENTITY_ENABLED = "1"
  ABOGALIA_AUTH_EMAIL_READY = "1"
  ABOGALIA_WEB_ORIGIN = "https://legalia-web.legaliasupport.workers.dev"

[deploy]
  strategy = "immediate"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
