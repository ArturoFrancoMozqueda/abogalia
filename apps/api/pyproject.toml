[project]
name = "abogalia-api"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.143.0",
  "pydantic==2.14.1",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.15.1",
  "cryptography==50.0.2",
  "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = ["ruff==0.17.0", "pytest==9.1.1"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
